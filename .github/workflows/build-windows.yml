name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Test selection capture
        shell: powershell
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Build application and installer
        shell: powershell
        run: .\scripts\build.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SelectTranslate-Windows
          path: release/SelectTranslate-Setup-*.exe

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter 'SelectTranslate-Setup-*.exe' -File | Select-Object -First 1 -ExpandProperty FullName
          if (-not $installer) { throw 'Installer not found' }
          gh release create $env:GITHUB_REF_NAME $installer --generate-notes
